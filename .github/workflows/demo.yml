name: Interactive demo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    container:
      # Match demo/package-lock.json. Browsers and OS dependencies are baked in;
      # this avoids runner-wide apt sources unrelated to the test environment.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python tools/build_demo.py
      - name: Ensure committed export matches its source
        # The container and checkout action can have different home/owner contexts.
        run: git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --exit-code -- index.html thermal-bridge.html
      - run: npm run test:browser
      - run: npm run test:landing
      - name: Guarded thermal bridge replay and responsive hardware diagram
        run: node tools/test-thermal-bridge.cjs
      - name: Guarded thermal bridge 3D component and camera acceptance
        run: node tools/test-bridge-3d.cjs
      - name: Exploded component guide and responsive callouts
        run: npm run test:callouts
      - name: Verify hosted Pages assets and video captions over HTTP
        run: npm run test:hosted
      - run: python ../project/tools/analyze_primary_evidence.py --check
